name: Deploy to GitHub Pages

on:
  push:
    branches: [ astro ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Deploy to astro-gh-pages branch
        run: |
          echo "misakatang.cn" > dist/CNAME
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b astro-gh-pages
          git add dist -f
          git commit -m "Deploy site $(date -u +'%Y-%m-%d %H:%M:%S')"
          git push -f origin astro-gh-pages
